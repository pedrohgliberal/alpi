---
# roles/boot: kernel maintenance and GRUB settings (ported from AFPI/AAPI's common role).
# Written as KEY="value": edited in /etc/default/grub (Fedora, EL) or as a grub.d drop-in (Debian,
# Ubuntu; group_vars/family_*/boot.yml); the GRUB config is then regenerated. Skipped when
# /etc/default/grub does not exist (systemd-boot, containers).
grub_settings:
  GRUB_TIMEOUT: 5
  GRUB_TERMINAL_OUTPUT: gfxterm
  GRUB_GFXMODE: "1920x1080x32,1280x720x32,auto"

# Keys removed from /etc/default/grub. GRUB_GFXPAYLOAD (AFPI/AAPI wrote it as "keep") is read by
# nothing: grub2-mkconfig only knows GRUB_GFXPAYLOAD_LINUX, and only for non-BLS entries. On
# Fedora and EL (BLS) the blscfg module sets gfxpayload=keep in every kernel entry by itself
# (checked in grub2 2.12 on Fedora 44 and AlmaLinux 10, 2026-10-10).
grub_settings_absent: [GRUB_GFXPAYLOAD]

# Keep the kernels older than the newest (dnf's installonly_limit still prunes them): on EL with
# AlmaLinux's NVIDIA driver (nvidia_kmod_check, group_vars/all/nvidia.yml) a new kernel may come
# before its prebuilt module, and an older kernel in GRUB is the way back to the driver.
kernel_keep_old: "{{ nvidia_kmod_check | bool and 'nvidia-driver' in alpi_ids_selected | default([]) }}"
