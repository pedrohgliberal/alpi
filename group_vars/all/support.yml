---
# Support matrix: the playbook stops in env_setup on anything not listed here. An entry gives
# major versions ({min, max}, inclusive) or exact distribution_versions ({version: "26.04"} or a
# list: Ubuntu's major is the same for 26.04 and 26.10, and only the LTS releases are supported;
# every point release reports its LTS's version, 24.04.5 too). Checked by the alpi_support filter. There is
# no fallback by os_family: Rocky, CentOS Stream or Ubuntu are not "close enough" to a supported
# distro.
# Fedora from 44 (2026-11-12): each release needs its own catalog keys (group_vars/os_Fedora_NN);
# 41 and 42 are past their end of life, 43 near it.
# Debian 13 and Ubuntu 24.04 and 26.04: VM-checked (tests/vm-checklist-apt.md) and released since
# v1.7.0 (PROPOSAL.md, decision 6).
alpi_supported:
  Fedora: {min: 44, max: 45}
  AlmaLinux: {min: 10, max: 10}
  Debian: {min: 13, max: 13}
  Ubuntu: {version: ["24.04", "26.04"]}

# true: ids marked unavailable (~) on this distro stop the run instead of being skipped.
alpi_strict: false
