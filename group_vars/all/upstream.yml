---
# roles/upstream: software installed from its vendor's releases where the distro has no package
# (catalog values {upstream: <id>}). Each source has a type, handled by
# roles/upstream/tasks/<type>.yml. An id the catalog names but this map lacks stops the run.
#
# github_fonts: the latest GitHub release (release_api); the asset whose name matches 'asset'
# (a regex), checked against the digest GitHub publishes for it; the archive members matching
# 'files' go flat into 'dest'. Replaced wholesale when the release tag differs from the one
# recorded in <dest>/.version. If GitHub cannot be reached, what is installed stays.
#
# release_binary: one program from the latest release on GitHub, Gitea or Forgejo (release_api;
# their APIs share GitHub's shape), the asset matching 'asset', checked against GitHub's digest
# or, where the forge publishes none, the asset matching 'checksum_asset' (a sha256 file). The
# asset is unpacked by its name: .tar.gz gives up its 'member', .xz is decompressed, anything
# else is the program. Installed as 'dest' (root, 0755), replaced when the release tag differs
# from <upstream_version_dir>/<id>.version or the program is gone. x86_64 assets.
#
# release_package: the vendor's own .rpm or .deb from the latest GitHub release, for software no
# distro or third-party repository packages: 'asset' names the package format through
# upstream_package_format (group_vars/family_*/main.yml: rpm or deb), checked against GitHub's
# digest and installed with dnf or apt, so the package manager owns its files and runs its
# scripts. Installed when 'package' is not installed or its version is not the release tag's
# (a leading 'v' dropped); packages_absent removes the package. x86_64 assets.
upstream_version_dir: /var/lib/alpi/upstream

# Optional GitHub token for the release queries (ALPI_GITHUB_TOKEN in the environment of
# ansible-playbook): GitHub allows 60 unauthenticated API calls an hour per address, 5000 with a
# token. Sent only to https://api.github.com (alpi_release_headers). A fine-grained token with no
# permissions is enough: the repositories are public. tests/run.sh sets it from `gh auth token`.
upstream_github_token: "{{ lookup('ansible.builtin.env', 'ALPI_GITHUB_TOKEN') }}"

upstream_sources:
  # Ported from AAPI (EL10 has no Roboto package). Static hinted TTFs only, as distro packages
  # ship: adding the variable font too would show duplicate families in font pickers.
  roboto:
    type: github_fonts
    release_api: "https://api.github.com/repos/googlefonts/roboto-3-classic/releases/latest"
    asset: '[.]zip$'
    files: "hinted/static/*.ttf"
    dest: /usr/local/share/fonts/roboto

  # Gitea's CLI (works with Forgejo too). Debian 13 and Ubuntu 26.04 package it as tea-cli, years
  # behind (0.9.2 and 0.11.1 against 0.16.0 on 2026-10-28), so it comes from upstream everywhere.
  # A static Go program; Gitea publishes a .sha256 per archive, none for the bare program.
  tea:
    type: release_binary
    release_api: "https://gitea.com/api/v1/repos/gitea/tea/releases/latest"
    asset: '^tea-[0-9.]+-linux-amd64[.]xz$'
    checksum_asset: '^tea-[0-9.]+-linux-amd64[.]xz[.]sha256$'
    dest: /usr/local/bin/tea
  # Forgejo's CLI (fj). Ubuntu 26.04 packages 0.3.0 (0.7.0 upstream on 2026-10-28), the others
  # nothing. Needs glibc 2.39 (EL10 has exactly that), libssl3 and zlib; no checksum published,
  # so HTTPS is the only check.
  forgejo-cli:
    type: release_binary
    release_api: "https://codeberg.org/api/v1/repos/forgejo-contrib/forgejo-cli/releases/latest"
    asset: '^forgejo-cli-x86_64-linux[.]tar[.]gz$'
    member: fj
    dest: /usr/local/bin/fj
  # fastfetch where the distro has no package (Ubuntu 24.04 only; packaged from 24.10 on). The
  # regular build, not the "polyfilled" one for older glibc; GitHub publishes the digest.
  fastfetch:
    type: release_binary
    release_api: "https://api.github.com/repos/fastfetch-cli/fastfetch/releases/latest"
    asset: '^fastfetch-linux-amd64[.]tar[.]gz$'
    member: fastfetch-linux-amd64/usr/bin/fastfetch
    dest: /usr/local/bin/fastfetch
  # Logitech mouse and keyboard settings (buttons, DPI, SmartShift over HID++), an alternative to
  # Logi Options+, which has no Linux version. No distro, COPR or PPA packages it (checked
  # 2026-11-07); the vendor's .rpm (unsigned, so dnf skips its GPG check: the digest is the
  # check) and .deb ship the udev rules (uaccess on hidraw, uinput and the mouse) and the agent's
  # systemd user unit, not enabled: tasks/reminders.yml reminds. Needs glibc 2.35. Conflicts with
  # Solaar (both hold the receiver), which ALPI does not install.
  openlogi:
    type: release_package
    release_api: "https://api.github.com/repos/AprilNEA/OpenLogi/releases/latest"
    asset: '^openlogi-v[0-9.]+-linux-amd64[.]{{ upstream_package_format }}$'
    package: openlogi
