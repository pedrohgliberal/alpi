---
# Name checks, here and not in env_setup: package names from EPEL/RPM Fusion/COPR only resolve once
# the repos role has run. Installs nothing from the lists (only Flatpak itself and the Flathub
# remote, needed for the lookup). Also used alone by the 'catalog' Molecule scenario.
- name: Packages | Check native package names
  ansible.builtin.include_tasks: "check_{{ ansible_facts['os_family'] }}.yml"

- name: Packages | Install Flatpak
  ansible.builtin.package:
    name: flatpak
    state: present
  when: (alpi_pkgs.flatpak + alpi_pkgs_extra.flatpak) | length > 0

- name: Packages | Add the Flathub remote
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    state: present
  when: (alpi_pkgs.flatpak + alpi_pkgs_extra.flatpak) | length > 0

- name: Packages | Look up flatpak ids on Flathub
  ansible.builtin.command:
    argv: [flatpak, remote-info, flathub, "{{ item }}"]
  loop: "{{ alpi_pkgs.flatpak + alpi_pkgs_extra.flatpak }}"
  register: _flatpak_info
  changed_when: false
  failed_when: false
  check_mode: false

# pipx apps (roles/pipx) are looked up on PyPI by name, extras and version specifiers aside
- name: Packages | Look up pipx apps on PyPI
  ansible.builtin.uri:
    url: "https://pypi.org/pypi/{{ item | alpi_pipx_name | urlencode }}/json"
    method: HEAD
    status_code: [200, 404]
  loop: "{{ (alpi_pkgs.pipx + alpi_pkgs_extra.pipx) | unique }}"
  register: _pypi_info
  check_mode: false

# Upstream sources (roles/upstream): GitHub must name a release with a matching asset. A 404 or a
# release without one is an error (the source moved); no answer (offline, rate limit) only a
# warning, as the role then keeps what is installed. A vendor_package source has no release: its
# download URL must answer (a 404 is an error), looked up with HEAD (no download).
- name: Packages | Upstream sources to check
  ansible.builtin.set_fact:
    _upstream_ids: "{{ (alpi_pkgs.upstream + alpi_pkgs_extra.upstream) | unique }}"
    _vendor_ids: >-
      {{ upstream_sources | dict2items | selectattr('value.type', 'eq', 'vendor_package')
         | map(attribute='key') | list }}

- name: Packages | Look up upstream releases
  ansible.builtin.uri:
    url: "{{ upstream_sources[item].release_api }}"
    headers: "{{ upstream_sources[item].release_api | alpi_release_headers(upstream_github_token) }}"
    return_content: true
    status_code: [200, 404]
  loop: "{{ _upstream_ids | reject('in', _vendor_ids) | list }}"
  register: _upstream_info
  failed_when: false
  check_mode: false

- name: Packages | Look up vendor packages
  ansible.builtin.uri:
    url: "{{ upstream_sources[item].url[upstream_package_format] }}"
    method: HEAD
    status_code: [200, 404]
  loop: "{{ _upstream_ids | select('in', _vendor_ids) | list }}"
  register: _vendor_info
  failed_when: false
  check_mode: false

- name: Packages | Upstream sources that could not be checked
  ansible.builtin.debug:
    msg: "Could not reach {{ upstream_sources[item.item].release_api | default(item.url | default('n/a')) }} (status {{ item.status | default('n/a') }}): {{ item.item }} not checked."
  loop: "{{ (_upstream_info.results | default([]) + _vendor_info.results | default([])) | rejectattr('status', 'in', [200, 404]) | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: Packages | Fail on unknown names
  ansible.builtin.assert:
    that: (alpi_missing_native + _missing_flatpak + _missing_pipx + _missing_upstream) | length == 0
    fail_msg: >-
      Not found, none of the listed packages was installed. Native packages (not in any enabled repository):
      {{ alpi_missing_native | join(', ') or 'none' }}. Flatpaks (not on Flathub):
      {{ _missing_flatpak | join(', ') or 'none' }}. pipx apps (not on PyPI):
      {{ _missing_pipx | join(', ') or 'none' }}. Upstream sources (no such release or asset):
      {{ _missing_upstream | join(', ') or 'none' }}. Fix the pkg:/flatpak:/pipx: names in
      host_vars/127.0.0.1/custom.yml, or the entry in group_vars/all/catalog.yml (upstream
      sources: group_vars/all/upstream.yml).
    quiet: true
  vars:
    _missing_flatpak: "{{ _flatpak_info.results | default([]) | rejectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"
    _missing_pipx: "{{ _pypi_info.results | default([]) | rejectattr('status', 'equalto', 200) | map(attribute='item') | list }}"
    _missing_upstream: >-
      {{ _upstream_info.results | default([]) | alpi_upstream_missing(upstream_sources | default({}))
         + _vendor_info.results | default([]) | selectattr('status', 'defined') | selectattr('status', 'eq', 404)
           | map(attribute='item') | list }}

- name: Packages | Fail on unresolvable dependencies
  ansible.builtin.assert:
    that: alpi_unresolved_native | default([]) | length == 0
    fail_msg: >-
      Dependencies could not be resolved, none of the listed packages was installed:
      {{ alpi_unresolved_native | join(' ') }} A freeworld package (RPM Fusion) usually waits
      for a rebuild against the library EPEL just updated; on apt, a package may need a component
      or architecture that is not enabled. Skip it in host_vars/127.0.0.1/custom.yml
      (packages_skip) until then.
    quiet: true
