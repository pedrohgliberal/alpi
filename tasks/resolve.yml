---
# Package and feature resolution (PROPOSAL.md, "Customization"). Every check runs here, before
# any role changes the system. Results:
#   alpi_feature:    feature name -> bool (resolved first: features add package sets)
#   alpi_zsh_aliases_on: zsh alias name -> bool, the picker's and custom.yml's choices (roles/zsh)
#   alpi_pkgs:       base set (repo defaults + distro + desktop + enabled features' packages +
#                    the picker's additions, minus the picker's and the user's skips)
#   alpi_pkgs_extra: the user's packages_add (installed in a separate step, after the base)
#   alpi_pkgs_absent: the user's packages_absent (explicit uninstall)
#   (each of the three: native, flatpak, pipx and upstream names, see alpi_resolve)
#   alpi_ids_selected: catalog ids that will be installed (base + extra, minus the unavailable):
#                    what roles gate their configuration on
#   alpi_repos_enabled: repository definitions to enable, in order (roles/repos)
#   alpi_cedilla_xwayland: run Chromium/Electron apps on XWayland for the cedilla (KDE with an
#                    older KWin; cedilla_xwayland in group_vars/all/desktop.yml)
#   alpi_flatpak_overrides: [{app, flags, reset_if}] for the selected Flatpak apps (roles/packages)
#   alpi_dns_connections: [{uuid, name}] the connections roles/dns manages (the picker's, or
#                    custom.yml's dns_connections)

- name: Resolve | Merge features
  ansible.builtin.set_fact:
    alpi_features_merged: "{{ features_default | combine(features_selection | default({}), features | default({})) }}"

- name: Resolve | Check feature names
  ansible.builtin.assert:
    that: _unknown | length == 0
    fail_msg: "Unknown features: {{ _unknown | join(', ') }}. Known: {{ features_default.keys() | join(', ') }}."
    quiet: true
  vars:
    _unknown: "{{ alpi_features_merged.keys() | difference(features_default.keys()) }}"

# An NVIDIA GPU older than Turing counts as not detected where the driver has only open modules
# (nvidia_open_modules_only), which cannot drive it: the feature stays off and nouveau stays.
- name: Resolve | Set feature flags
  ansible.builtin.set_fact:
    alpi_feature: "{{ alpi_features_merged | alpi_features(alpi_hardware_features, {'nvidia': is_nvidia | bool and not (_nvidia_unsupported | bool), 'asus': is_asus | bool, 'intel': is_intel | bool, 'amd': is_amd | bool}) }}"
    alpi_nvidia_unsupported: "{{ _nvidia_unsupported }}"
  vars:
    _nvidia_unsupported: "{{ is_nvidia | bool and is_nvidia_pre_turing | default(false) | bool and nvidia_open_modules_only | bool }}"

- name: Resolve | Report an NVIDIA GPU the driver cannot drive
  ansible.builtin.debug:
    msg: >-
      NVIDIA GPU older than Turing ({{ gpu_info | default('') | regex_findall('\\[10de:[0-9a-f]{4}\\]') | join(', ') or 'pinned' }}):
      {{ ansible_facts['distribution'] }}'s NVIDIA driver has only open kernel modules, which drive
      Turing (GTX 16xx, RTX 20xx, MX450) and newer. The nvidia feature is off; nouveau stays.
  when: alpi_nvidia_unsupported | bool

- name: Resolve | Merge zsh aliases
  ansible.builtin.set_fact:
    alpi_zsh_aliases_on: "{{ zsh_aliases_selection | default({}) | combine(zsh_aliases_enabled | default({})) }}"

- name: Resolve | Check zsh alias names
  ansible.builtin.assert:
    that: _unknown | length == 0
    fail_msg: "Unknown zsh aliases: {{ _unknown | join(', ') }}. Known: {{ _known | join(', ') }}."
    quiet: true
  vars:
    _known: >-
      {{ zsh_aliases.keys() | list + (zsh_aliases_family | default({})).keys() | list
         + (zsh_aliases_os | default({})).keys() | list }}
    _unknown: "{{ alpi_zsh_aliases_on.keys() | difference(_known) }}"

- name: Resolve | Select package ids
  ansible.builtin.set_fact:
    alpi_ids_base: >-
      {{ (packages_base + (packages_os | default([]))
          + (packages_kde if is_kde else []) + (packages_gnome if is_gnome else [])
          + (packages_selection_add | default([]))
          + (feature_packages | default({}) | alpi_feature_ids(alpi_feature)))
         | alpi_canonical(alpi_catalog_aliases) | unique
         | reject('in', packages_selection_skip | default([]) | alpi_canonical(alpi_catalog_aliases))
         | reject('in', packages_skip | default([]) | alpi_canonical(alpi_catalog_aliases)) | list }}
    alpi_ids_extra: >-
      {{ packages_add | default([]) | alpi_canonical(alpi_catalog_aliases) | unique
         | reject('in', packages_skip | default([]) | alpi_canonical(alpi_catalog_aliases)) | list }}
    alpi_ids_absent: "{{ packages_absent | default([]) | alpi_canonical(alpi_catalog_aliases) | unique }}"

- name: Resolve | Look up the catalog
  ansible.builtin.set_fact:
    alpi_pkgs: "{{ alpi_ids_base | alpi_resolve(alpi_catalog, alpi_catalog_keys, alpi_catalog_aliases) }}"
    alpi_pkgs_extra: "{{ alpi_ids_extra | reject('in', alpi_ids_base) | list | alpi_resolve(alpi_catalog, alpi_catalog_keys, alpi_catalog_aliases) }}"
    alpi_pkgs_absent: "{{ alpi_ids_absent | alpi_resolve(alpi_catalog, alpi_catalog_keys, alpi_catalog_aliases) }}"

- name: Resolve | Check package ids
  ansible.builtin.assert:
    that:
      - _unknown | length == 0
      - _missing | length == 0
      - _conflict | length == 0
    fail_msg: "{{ _messages | select | join(' ') }}"
    quiet: true
  vars:
    _unknown: "{{ alpi_pkgs.unknown + alpi_pkgs_extra.unknown + alpi_pkgs_absent.unknown }}"
    _missing: "{{ alpi_pkgs.missing + alpi_pkgs_extra.missing + alpi_pkgs_absent.missing }}"
    _conflict: "{{ (alpi_ids_base + alpi_ids_extra) | intersect(alpi_ids_absent) }}"
    _messages:
      - "{{ ('Unknown package ids (not in group_vars/all/catalog.yml; use pkg:<name> or flatpak:<app id> for names outside the catalog): ' ~ _unknown | join(', ') ~ '.') if _unknown else '' }}"
      - "{{ ('Catalog bug, no entry for this distro (keys ' ~ alpi_catalog_keys | join(', ') ~ '): ' ~ _missing | join(', ') ~ '.') if _missing else '' }}"
      - "{{ ('Both installed and in packages_absent: ' ~ _conflict | join(', ') ~ '.') if _conflict else '' }}"

# Catalog values {upstream: <id>} name a source in upstream_sources (group_vars/all/upstream.yml)
- name: Resolve | Check upstream sources
  ansible.builtin.assert:
    that: _unknown | length == 0
    fail_msg: >-
      Catalog bug, upstream sources with no definition (upstream_sources in
      group_vars/all/upstream.yml): {{ _unknown | join(', ') }}.
    quiet: true
  vars:
    _unknown: "{{ (alpi_pkgs.upstream + alpi_pkgs_extra.upstream + alpi_pkgs_absent.upstream) | unique | difference(upstream_sources | default({}) | list) }}"

- name: Resolve | Set the selected ids
  ansible.builtin.set_fact:
    alpi_ids_selected: >-
      {{ (alpi_ids_base + alpi_ids_extra)
         | reject('in', alpi_pkgs.unavailable + alpi_pkgs_extra.unavailable) | list }}

# Another NVIDIA driver source next to the distro's (RPM Fusion's akmod, NVIDIA's CUDA DKMS on
# EL): the run stops before anything is installed and names what to remove. Never a removal here,
# and never a '*nvidia*' glob: it would take nvidia-gpu-firmware, which the kernel needs.
- name: Resolve | NVIDIA packages from another source
  when:
    - "'nvidia-driver' in alpi_ids_selected"
    - nvidia_foreign_packages | length > 0
  block:
    - name: Resolve | List installed packages
      ansible.builtin.command: rpm -qa --qf '%{NAME}\n'
      register: _rpm_names
      changed_when: false
      check_mode: false

    - name: Resolve | Refuse to mix NVIDIA driver sources
      ansible.builtin.assert:
        that: _foreign | length == 0
        fail_msg: >-
          NVIDIA packages from another source are installed: {{ _foreign | join(', ') }}.
          ALPI installs {{ ansible_facts['distribution'] }}'s own driver and will not mix the two.
          Remove them by name (sudo dnf remove --noautoremove {{ _foreign | join(' ') }}; never a
          '*nvidia*' glob, which takes nvidia-gpu-firmware with it) and run again, or keep that
          driver and veto ALPI's (features: {nvidia: false} in custom.yml).
        quiet: true
      vars:
        _foreign: "{{ _rpm_names.stdout | alpi_nvidia_foreign(nvidia_foreign_packages, nvidia_foreign_packages_allowed) }}"

- name: Resolve | Check unavailable packages (strict mode)
  ansible.builtin.assert:
    that: _unavailable | length == 0
    fail_msg: "Not available on {{ ansible_facts['distribution'] }}: {{ _unavailable | join(', ') }} (alpi_strict is on)."
    quiet: true
  vars:
    _unavailable: "{{ alpi_pkgs.unavailable + alpi_pkgs_extra.unavailable }}"
  when: alpi_strict | bool

- name: Resolve | Select repositories
  ansible.builtin.set_fact:
    _repos: >-
      {{ (alpi_repos_family | default({})) | combine(alpi_repos_os | default({}))
         | alpi_repos(alpi_repos_always | default([]), alpi_pkgs.repos + alpi_pkgs_extra.repos) }}

- name: Resolve | Check repository ids
  ansible.builtin.assert:
    that: _repos.unknown | length == 0
    fail_msg: >-
      Catalog bug, repositories with no definition for {{ ansible_facts['distribution'] }}
      (alpi_repos_family / alpi_repos_os): {{ _repos.unknown | join(', ') }}.
    quiet: true

- name: Resolve | Set repositories
  ansible.builtin.set_fact:
    alpi_repos_enabled: "{{ _repos.enabled }}"

- name: Resolve | Check the cedilla setting
  ansible.builtin.assert:
    that: cedilla_xwayland in ['auto', true, false]
    fail_msg: >-
      cedilla_xwayland must be auto, true or false (host_vars/127.0.0.1/custom.yml), not
      '{{ cedilla_xwayland }}'.
    quiet: true

# zram_size goes into an ini file: one expression, no line breaks or sections
- name: Resolve | Check the memory settings
  ansible.builtin.assert:
    that:
      - zram in ['auto', true, false]
      - zram_size | string | length == 0 or zram_size | string is regex('^[A-Za-z0-9_ ().,+*/-]+$')
      - hibernate in [true, false]
    fail_msg: >-
      Invalid memory settings (host_vars/127.0.0.1/custom.yml): zram must be auto, true or false
      (not '{{ zram }}'), zram_size a zram-generator expression such as 'ram / 2' or empty (not
      '{{ zram_size }}'), hibernate true or false (not '{{ hibernate }}').
    quiet: true

# dns_connections (custom.yml) replaces the picker's list; null means unset
- name: Resolve | Select DNS connections
  ansible.builtin.set_fact:
    alpi_dns_connections: "{{ dns_connections | default(none) | alpi_dns_connections(dns_connections_selection | default({})) }}"

- name: Resolve | Check the DNS settings
  ansible.builtin.assert:
    that: _errors | length == 0
    fail_msg: "Invalid DNS settings (group_vars/all/dns.yml, host_vars/127.0.0.1/): {{ _errors | join(' ') }}"
    quiet: true
  vars:
    _errors: "{{ dns_ipv4 | alpi_dns_invalid(dns_ipv6, alpi_dns_connections) }}"

# Again after roles/update, which may upgrade KWin (tasks/cedilla.yml)
- name: Resolve | Cedilla on XWayland and Flatpak overrides
  ansible.builtin.import_tasks: cedilla.yml

- name: Resolve | Summary
  ansible.builtin.debug:
    msg:
      distro: "{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}"
      desktop: "{{ 'KDE' if is_kde else ('GNOME' if is_gnome else 'none detected') }}"
      native: "{{ alpi_pkgs.native }}"
      flatpak: "{{ alpi_pkgs.flatpak }}"
      pipx: "{{ alpi_pkgs.pipx }}"
      upstream: "{{ alpi_pkgs.upstream }}"
      extra: "{{ alpi_pkgs_extra.native + alpi_pkgs_extra.flatpak + alpi_pkgs_extra.pipx + alpi_pkgs_extra.upstream }}"
      absent: "{{ alpi_pkgs_absent.native + alpi_pkgs_absent.flatpak + alpi_pkgs_absent.pipx + alpi_pkgs_absent.upstream }}"
      unavailable_skipped: "{{ alpi_pkgs.unavailable + alpi_pkgs_extra.unavailable }}"
      features: "{{ alpi_feature }}"
      repos: "{{ alpi_repos_enabled | map(attribute='id') }}"
      flatpak_overrides: "{{ alpi_flatpak_overrides | map(attribute='app') }}"
      cedilla_xwayland: "{{ alpi_cedilla_xwayland }} (KWin {{ kwin_version | default('') or 'not found' }})"
      dns_connections: "{{ alpi_dns_connections | map(attribute='name') }}"
