---
# AlmaLinux 10, work machine (custom.yml + selection.yml): resolution + the packages role, and
# the same resolution run by EL10's own ansible-core 2.16 inside the container (a real run uses
# it as the controller; Molecule's controller is the host's newer ansible-core).
# Repos: CRB, EPEL, RPM Fusion EL, Brave, VS Code, GitHub CLI. Flatpaks are covered by
# fedora44-personal and skipped here. prepare.yml first writes AAPI's repository files (migration).
platforms:
  - name: alpi-el10-work
    image: docker.io/library/almalinux:10
    pre_build_image: true
    command: sleep infinity
    volumes: ["alpi-dnf-el10-work:/var/cache/dnf"]
provisioner:
  options:
    # Intel, AMD and NVIDIA (a Turing or newer GPU) forced on: Intel's drivers and AlmaLinux's
    # NVIDIA driver install (prepare.yml installs a kernel first); AMD's packages are unavailable
    # on EL. roles/akmods_mok does nothing for NVIDIA (prebuilt, signed modules). A hybrid laptop
    # (is_intel_panel): KWin on the iGPU (prepare.yml stands in for udevd's link).
    extra-vars: '{"is_nvidia": true, "is_nvidia_pre_turing": false, "is_intel_panel": true, "is_asus": false, "is_intel": true, "is_amd": true}'
    # No systemd here: services are covered by the 'services' and 'asus' scenarios; the upgrade
    # and reboot gate by 'update' (needs-restarting is unreliable in a container); swap by
    # 'memory' (a container sees the host's swap and zswap). Setting skip-tags replaces
    # Molecule's default, so its own tags are repeated.
    skip-tags: molecule-notest,notest,clamav,supergfxd,switcheroo,update,memory
  playbooks:
    prepare: prepare.yml
