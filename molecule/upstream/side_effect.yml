---
# New releases are published after converge + idempotence (Roboto, tea and openlogi), and fj is
# deleted while its release stays v1: the next run must replace Roboto and tea, upgrade openlogi
# and put fj v1 back. google-chrome-stable 2.0.0 replaces 1.0.0 at its fixed URL: the next run must
# leave the installed 1.0.0 alone (Google's repository updates it, not ALPI)
- name: Side effect | Publish v2, delete fj
  hosts: alpi-up-install
  gather_facts: false
  tasks:
    - name: Side effect | latest -> v2
      ansible.builtin.copy:
        src: "/srv/alpi-up/{{ item.src }}"
        dest: "/srv/alpi-up/{{ item.dest }}"
        remote_src: true
        mode: "0644"
      loop:
        - { src: release-v2.json, dest: repos/googlefonts/roboto-3-classic/releases/latest }
        - { src: tea-release-v2.json, dest: api/v1/repos/gitea/tea/releases/latest }
        - { src: openlogi-release-v2.0.0.json, dest: repos/AprilNEA/OpenLogi/releases/latest }
        - { src: chrome-2.0.0.rpm, dest: dl/chrome/google-chrome-stable_current_x86_64.rpm }

    - name: Side effect | fj gone
      ansible.builtin.file:
        path: /usr/local/bin/fj
        state: absent

- name: Side effect | Run again
  ansible.builtin.import_playbook: converge.yml
