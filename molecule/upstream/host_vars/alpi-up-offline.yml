---
# Nothing listens on port 9: the forges "unreachable"
upstream_sources:
  roboto:
    type: github_fonts
    release_api: http://127.0.0.1:9/repos/googlefonts/roboto-3-classic/releases/latest
    asset: '[.]zip$'
    files: "hinted/static/*.ttf"
    dest: /usr/local/share/fonts/roboto
  tea:
    type: release_binary
    release_api: http://127.0.0.1:9/api/v1/repos/gitea/tea/releases/latest
    asset: '^tea-[0-9.]+-linux-amd64[.]xz$'
    checksum_asset: '^tea-[0-9.]+-linux-amd64[.]xz[.]sha256$'
    dest: /usr/local/bin/tea
  forgejo-cli:
    type: release_binary
    release_api: http://127.0.0.1:9/api/v1/repos/forgejo-contrib/forgejo-cli/releases/latest
    asset: '^forgejo-cli-x86_64-linux[.]tar[.]gz$'
    member: fj
    dest: /usr/local/bin/fj
  openlogi:
    type: release_package
    release_api: http://127.0.0.1:9/repos/AprilNEA/OpenLogi/releases/latest
    asset: '^openlogi-v[0-9.]+-linux-amd64[.]{{ upstream_package_format }}$'
    package: openlogi
  # Unsigned stand-in (no key): the signature check is the real Chrome's, in the personal scenarios
  google-chrome:
    type: vendor_package
    url:
      rpm: http://127.0.0.1:9/dl/chrome/google-chrome-stable_current_x86_64.rpm
      deb: http://127.0.0.1:9/dl/chrome/google-chrome-stable_current_amd64.deb
    package: google-chrome-stable
