---
- name: Verify | Module signing keys, VirtualBox groups and kvm setting, NVIDIA settings
  hosts: all
  tasks:
    - name: Verify | Resolve again
      ansible.builtin.include_tasks: ../../tasks/env_setup.yml

    - name: Verify | Look up the files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/modprobe.d/nvidia.conf
        - /etc/pki/akmods/certs/public_key.der
        - /var/lib/shim-signed/mok/MOK.der
        - /var/lib/shim-signed/mok/MOK.priv
        - /etc/modprobe.d/alpi-kvm.conf
        - /var/lib/dkms/mok.pub
        - /etc/modprobe.d/alpi-nvidia.conf
      register: _files

    - name: Verify | Read the kvm setting
      ansible.builtin.slurp:
        src: /etc/modprobe.d/alpi-kvm.conf
      register: _kvm_conf
      when: _files.results[4].stat.exists

    - name: Verify | Read the fake mokutil log
      ansible.builtin.command: cat /var/log/fake-mokutil.log
      register: _mok_log
      changed_when: false
      failed_when: false

    - name: Verify | Look up the VirtualBox groups
      ansible.builtin.getent:
        database: group
        key: "{{ item }}"
      loop: [vboxusers, vboxsf]
      when: inventory_hostname != 'alpi-nosb-fedora44'

    - name: Verify | Set the results
      ansible.builtin.set_fact:
        _nvidia_conf: "{{ _files.results[0].stat.exists }}"
        _akmods_key: "{{ _files.results[1].stat.exists }}"
        _oracle_key: "{{ _files.results[2].stat.exists }}"
        _oracle_priv_mode: "{{ _files.results[3].stat.mode | default('') }}"
        _imports: "{{ _mok_log.stdout_lines | default([]) | select('match', '--import ') | list }}"
        _kvm_options: "{{ (_kvm_conf.content | default('') | b64decode).splitlines() | select('match', 'options ') | list }}"

    - name: Verify | kvm leaves VMX off where VirtualBox is on, setting removed where it is off
      ansible.builtin.assert:
        that: >-
          _kvm_options == ['options kvm enable_virt_at_load=0']
          if inventory_hostname != 'alpi-nosb-fedora44' else not _files.results[4].stat.exists
        fail_msg: "alpi-kvm.conf options: {{ _kvm_options }}"
        quiet: true

    - name: Verify | Secure Boot on Fedora, NVIDIA vetoed - akmods key from the virtualbox id
      ansible.builtin.assert:
        that:
          - is_secure_boot and not alpi_feature.nvidia
          - _akmods_key and not _oracle_key and not _nvidia_conf
          - _imports == ['--import /etc/pki/akmods/certs/public_key.der']
          - "'password: fedora-alpi / fedora-alpi' in _mok_log.stdout_lines"
        fail_msg: "mokutil log: {{ _mok_log.stdout_lines | default([]) }}"
        quiet: true
      when: inventory_hostname == 'alpi-sb-fedora44'

    - name: Verify | No Secure Boot, NVIDIA on - settings only, no key, no mokutil call
      ansible.builtin.assert:
        that:
          - not is_secure_boot
          - _nvidia_conf and not _akmods_key and not _oracle_key
          - _mok_log.rc != 0
        quiet: true
      when: inventory_hostname == 'alpi-nosb-fedora44'

    - name: Verify | Read NVIDIA's options and the vendor file (EL)
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: [/etc/modprobe.d/alpi-nvidia.conf, /usr/lib/modprobe.d/nvidia.conf]
      register: _sb_el_conf
      when: inventory_hostname == 'alpi-sb-el10'

    # kmod_signer none: AlmaLinux's NVIDIA modules come prebuilt and signed, so no key for them
    # (only Oracle's) and no /etc/modprobe.d/nvidia.conf masking the vendor's
    - name: Verify | Secure Boot on EL - Oracle VirtualBox key, NVIDIA options in ALPI's file
      ansible.builtin.assert:
        that:
          - is_secure_boot and alpi_feature.nvidia and 'nvidia-driver' in alpi_ids_selected
          - _oracle_key and _oracle_priv_mode == '0600' and not _akmods_key and not _nvidia_conf
          - not _files.results[5].stat.exists
          - "'options nvidia NVreg_DynamicPowerManagement=0x02' in (_sb_el_conf.results[0].content | b64decode)"
          - (_sb_el_conf.results[1].content | b64decode) == 'blacklist nouveau\nblacklist nova-core\n'
          - _imports == ['--import /var/lib/shim-signed/mok/MOK.der']
          - "'password: alma-alpi / alma-alpi' in _mok_log.stdout_lines"
        fail_msg: "mokutil log: {{ _mok_log.stdout_lines | default([]) }}"
        quiet: true
      when: inventory_hostname == 'alpi-sb-el10'

    - name: Verify | Read the NVIDIA modprobe files (Debian)
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: [/etc/modprobe.d/nvidia.conf, /etc/modprobe.d/alpi-nvidia.conf]
      register: _sb_deb_conf
      when: inventory_hostname == 'alpi-sb-debian13'

    - name: Verify | Read NVIDIA's options (Ubuntu)
      ansible.builtin.slurp:
        src: /etc/modprobe.d/alpi-nvidia.conf
      register: _sb_ubu_conf
      when: inventory_hostname in ['alpi-sb-ubuntu2604', 'alpi-sb-ubuntu2404']

    - name: Verify | Secure Boot on Ubuntu - one shim-signed key for DKMS and VirtualBox, options for nvidia
      ansible.builtin.assert:
        that:
          - is_secure_boot and alpi_feature.nvidia and 'virtualbox' in alpi_ids_selected
          - _oracle_key and _oracle_priv_mode == '0600' and not _akmods_key and not _files.results[5].stat.exists
          - _imports == ['--import /var/lib/shim-signed/mok/MOK.der']
          - "'password: ubuntu-alpi / ubuntu-alpi' in _mok_log.stdout_lines"
          - "'options nvidia NVreg_DynamicPowerManagement=0x02' in (_sb_ubu_conf.content | b64decode)"
        fail_msg: "mokutil log: {{ _mok_log.stdout_lines | default([]) }}"
        quiet: true
      when: inventory_hostname in ['alpi-sb-ubuntu2604', 'alpi-sb-ubuntu2404']

    - name: Verify | Secure Boot on Debian - DKMS and Oracle keys, NVIDIA options for nvidia-current
      ansible.builtin.assert:
        that:
          - is_secure_boot and alpi_feature.nvidia and 'virtualbox' in alpi_ids_selected
          - _files.results[5].stat.exists and _oracle_key and _oracle_priv_mode == '0600' and not _akmods_key
          - _imports == ['--import /var/lib/dkms/mok.pub', '--import /var/lib/shim-signed/mok/MOK.der']
          - "'password: debian-alpi / debian-alpi' in _mok_log.stdout_lines"
          - (_sb_deb_conf.results[0].content | b64decode) == 'install nvidia modprobe -i nvidia-current $CMDLINE_OPTS\n'
          - "'options nvidia-current NVreg_DynamicPowerManagement=0x02' in (_sb_deb_conf.results[1].content | b64decode)"
          - "'options nvidia ' not in (_sb_deb_conf.results[1].content | b64decode)"
        fail_msg: "mokutil log: {{ _mok_log.stdout_lines | default([]) }}"
        quiet: true
      when: inventory_hostname == 'alpi-sb-debian13'

    # group_vars/all/nvidia.yml: EL only. is_intel_panel is pinned true on every instance, so
    # Fedora, Debian and Ubuntu (NVIDIA on, a hybrid laptop) must get none of it
    - name: Verify | Look up the EL NVIDIA extras
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/etc/udev/rules.d/61-igpu-card.rules, /usr/local/bin/prime-run, /usr/local/bin/nvidia-kmod-check]
      register: _sb_extras

    - name: Verify | Read /etc/environment
      ansible.builtin.command: cat /etc/environment
      register: _sb_env
      changed_when: false
      failed_when: false

    - name: Verify | Read the udev rule and prime-run (EL)
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: [/etc/udev/rules.d/61-igpu-card.rules, /usr/local/bin/prime-run]
      register: _sb_el_extras
      when: inventory_hostname == 'alpi-sb-el10'

    # The stale line gave way; prime-run and the check are root 0755. No kernel here: the check
    # runs and warns (no kernel-core), which must not fail the run.
    - name: Verify | EL - KWin on the iGPU, prime-run, the kernel/module check
      ansible.builtin.assert:
        that:
          - _sb_extras.results | map(attribute='stat.exists') | list == [true, true, true]
          - _sb_extras.results[1].stat.mode == '0755' and _sb_extras.results[1].stat.pw_name == 'root'
          - _sb_extras.results[2].stat.mode == '0755'
          - _sb_env.stdout_lines == ['LANG=en_US.UTF-8', 'KWIN_DRM_DEVICES=/dev/dri/igpu-card']
          - (_sb_el_extras.results[0].content | b64decode) == (lookup('file', _role_files ~ '/61-igpu-card.rules') ~ '\n')
          - (_sb_el_extras.results[1].content | b64decode) == (lookup('file', _role_files ~ '/prime-run') ~ '\n')
          - "'SYMLINK+=\"dri/igpu-card\"' in (_sb_el_extras.results[0].content | b64decode)"
        fail_msg: "extras: {{ _sb_extras.results | map(attribute='stat.exists') | list }}, environment: {{ _sb_env.stdout_lines }}"
        quiet: true
      vars:
        _role_files: "{{ playbook_dir }}/../../roles/nvidia/files"
      when: inventory_hostname == 'alpi-sb-el10'

    - name: Verify | Fedora, Debian, Ubuntu - none of EL's NVIDIA extras
      ansible.builtin.assert:
        that:
          - _sb_extras.results | map(attribute='stat.exists') | list == [false, false, false]
          - "'KWIN_DRM_DEVICES' not in _sb_env.stdout"
        fail_msg: "extras: {{ _sb_extras.results | map(attribute='stat.exists') | list }}, environment: {{ _sb_env.stdout_lines }}"
        quiet: true
      when: inventory_hostname != 'alpi-sb-el10'
