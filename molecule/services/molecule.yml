---
# Roles that manage systemd services, alone (env_setup + the role; the packages they need are
# installed by prepare.yml, not by the packages role). AlmaLinux publishes an init image, Fedora
# does not; the units have the same names on both. Debian has none either: its instance is built
# from shared/Dockerfile-systemd-apt.j2.
#   alpi-svc-on:   clamav feature on, freshclam installed: the service is enabled and running
#   alpi-svc-skip: clamav feature on, clamav-freshclam skipped and not installed: nothing to do
#                  (AFPI/AAPI enabled freshclam unconditionally and failed here)
#   alpi-svc-debian13: as alpi-svc-on, on Debian 13
# NVIDIA is pinned on: switcheroo-control (roles/nvidia's switcheroo.yml, EL's nvidia-switcheroo)
# enabled and running on alpi-svc-on, left alone where its id is skipped (alpi-svc-skip) or
# resolves to nothing (Debian). And KWin on the iGPU (roles/nvidia's kwin_igpu.yml) on desktops
# (is_intel_panel pinned false): forced by nvidia_kwin_igpu_force on alpi-svc-on, an earlier
# run's rules and two-device KWIN_DRM_DEVICES removed on alpi-svc-skip
platforms:
  - name: alpi-svc-on
    image: docker.io/almalinux/10-init
    pre_build_image: true
    command: /sbin/init
    systemd: always
    volumes: ["alpi-dnf-svc-on:/var/cache/dnf"]
  - name: alpi-svc-skip
    image: docker.io/almalinux/10-init
    pre_build_image: true
    command: /sbin/init
    systemd: always
    volumes: ["alpi-dnf-svc-skip:/var/cache/dnf"]
  - name: alpi-svc-debian13
    image: docker.io/library/debian:13
    pre_build_image: false
    dockerfile: ../shared/Dockerfile-systemd-apt.j2
    command: /sbin/init
    systemd: always
    volumes: ["alpi-dnf-svc-debian13:/var/cache/apt"]
provisioner:
  options:
    extra-vars: '{"is_nvidia": true, "is_nvidia_pre_turing": false, "is_intel_panel": false, "is_asus": false, "is_intel": false, "is_amd": false}'
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
