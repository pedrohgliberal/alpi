---
- name: Services | Guard against running on the host
  hosts: all
  gather_facts: false
  tasks:
    - name: Services | Require ALPI_TARGET
      ansible.builtin.assert:
        that: lookup('env', 'ALPI_TARGET') | length > 0
        fail_msg: ALPI_TARGET is not set; this scenario must target its containers. Set it in molecule.yml.
        quiet: true

- name: Services | env_setup + service roles
  hosts: all
  tasks:
    - name: Services | Environment setup
      ansible.builtin.import_tasks: ../../tasks/env_setup.yml

    - name: Services | ClamAV
      ansible.builtin.import_role:
        name: clamav

    # roles/nvidia's order: the udev trigger of kwin_igpu.yml comes before the service starts
    - name: Services | KWin on the iGPU (roles/nvidia, EL); a desktop, is_intel_panel pinned false
      ansible.builtin.include_role:
        name: nvidia
        tasks_from: kwin_igpu.yml
      when: nvidia_kwin_igpu | bool

    - name: Services | switcheroo-control (roles/nvidia)
      ansible.builtin.include_role:
        name: nvidia
        tasks_from: switcheroo.yml
